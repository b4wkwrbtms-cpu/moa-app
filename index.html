<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#F2F1EA"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="모아상점"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"></head><body><title>모아상점</title>
<meta name="description" content="프랜차이즈 가맹점 전용 박스 단위 주문몰">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
/* 레이아웃: moa 런칭 필름 기준 — 따뜻한 베이지 바탕 위 흰 라운드 카드(벤토), 검정 글자, 주황은 기준 월·로고 점·작은 강조에만.
   점주는 모바일 우선 1열 목록 / 데스크톱 4열 카드, 관리자·운영자는 같은 헤더 + 왼쪽 세로 메뉴 */
:root {
  /* 색 */
  --bg: #F2F1EA;
  --surface: #FFFFFF;
  --track: #EFEEE7;
  --field: #F7F6F1;
  --image-bg: #F2EFE8;
  --text: #0F1013;
  --text-sub: #6A6964;
  --text-mid: #3A3A3F;
  --line: #E6E2DA;
  --line-strong: #8A877F;     /* 눌리는 카드의 경계 (베이지 3.17:1, 흰색 3.59:1) — D-13 */
  --accent: #D3682F;          /* 큰 숫자·아이콘·막대·면 채우기에만 (흰 바탕 3.63:1) */
  --accent-text: #AD501D;     /* 글자·링크·작은 배지 바탕 (흰 바탕 5.33:1, 베이지 4.70:1) — D-12 */
  --accent-soft: #FBEADF;
  --bar-1: #0F1013;
  --bar-2: #393941;
  --bar-3: #6C6D72;
  --danger: #C62828;
  --danger-bg: #FDECEC;
  --warn: #7A5200;
  --warn-bg: #FFF3D9;
  --up: #C62828;
  --down: #1F57C3;
  --chart-muted: #B9B7B0;
  --chart-fill: #F2F1EA;
  --scrim: rgba(15, 16, 19, 0.45);
  --lift: 0 1px 2px rgba(15, 16, 19, 0.08);
  --on-dark: #FFFFFF;
  /* 상품 그림 */
  --art-dark: #1E1E1D; --art-rim: #4A4946; --art-white: #FCFBF8; --art-white-rim: #B9B5AD;
  --art-lid: #DADDDE; --art-lid-rim: #8D9294; --art-kraft: #C9A77A; --art-kraft-rim: #8C6E45; --art-shadow: rgba(0, 0, 0, 0.08);
  /* 간격 */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s12: 48px; --s16: 64px; --s24: 96px;
  /* 라운드 */
  --r8: 8px; --r12: 12px; --r16: 16px; --r20: 20px; --rpill: 999px;
  /* 글자 */
  /* 13px = 캡션·메타의 최저선, 15px = 본문 최저선, 본문 기본 16px (D-20, D-21) */
  --t13: 13px; --t15: 15px; --t16: 16px; --t20: 20px; --t24: 24px; --t32: 32px; --t40: 40px; --t48: 48px;
  --font: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  --header-h: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { margin: 0; font-family: var(--font); font-size: var(--t16); line-height: 1.6; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.025em; line-height: 1.3; }
p { margin: 0; }
a { color: inherit; }
img { max-width: 100%; display: block; }
.num, .tbl td.r, .price, .kpi-v { font-variant-numeric: tabular-nums; }
.sub { color: var(--text-sub); }
.t13 { font-size: var(--t13); } .t16 { font-size: var(--t16); }
.b { font-weight: 700; }
.mono { font-family: var(--mono); }
.label { font-size: var(--t13); font-weight: 600; color: var(--text-sub); }
.eyebrow { font-size: var(--t13); font-weight: 800; color: var(--accent-text); letter-spacing: 0.06em; text-transform: uppercase; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- 로고 ---------- */
.wordmark { font-weight: 900; font-size: var(--t24); letter-spacing: -0.05em; line-height: 1; }
.wordmark i { font-style: normal; color: var(--accent); }

/* ---------- 공지 바 ---------- */
.noticebar { background: var(--text); color: var(--on-dark); font-size: var(--t13); min-height: 36px; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s4); }
.noticebar button.go { flex: 1; min-width: 0; background: none; border: 0; color: inherit; text-align: center; cursor: pointer; padding: var(--s2) 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.noticebar button.x { background: none; border: 0; color: inherit; width: 44px; height: 44px; cursor: pointer; font-size: var(--t16); }
.vbar { background: var(--warn-bg); color: var(--warn); font-size: var(--t13); font-weight: 600; text-align: center; padding: var(--s2) var(--s4); }

/* ---------- 헤더 ---------- */
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); border-bottom: 1px solid var(--line); }
.header-in { height: var(--header-h); display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s8); margin: 0 auto; }
.header-in.w-owner { max-width: 1200px; } .header-in.w-staff { max-width: none; }
.logo { display: flex; align-items: center; gap: var(--s3); background: none; border: 0; padding: 0; cursor: pointer; min-width: 0; min-height: 44px; }
.logo .tag { font-size: var(--t13); color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px var(--s2); background: var(--track); border-radius: var(--rpill); font-weight: 600; }
.hnav { display: flex; gap: var(--s1); margin: 0 auto; background: var(--track); padding: var(--s1); border-radius: var(--r12); }
.hnav button { background: none; border: 0; min-height: 44px; padding: 0 var(--s4); cursor: pointer; font-size: var(--t15); color: var(--text-sub); font-weight: 600; border-radius: var(--r8); }
.hnav button[aria-current="page"] { color: var(--text); background: var(--surface); box-shadow: var(--lift); }
.hright { display: flex; align-items: center; gap: var(--s1); margin-left: auto; }
.iconbtn { position: relative; width: 44px; height: 44px; display: inline-grid; place-items: center; background: none; border: 0; border-radius: var(--r12); cursor: pointer; color: var(--text); }
.iconbtn:hover { background: var(--track); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn .cnt, .cnt-dot { position: absolute; top: 6px; right: 4px; min-width: 18px; height: 18px; border-radius: var(--rpill); background: var(--text); color: var(--on-dark); font-size: var(--t13); font-weight: 700; display: grid; place-items: center; padding: 0 var(--s1); line-height: 1; }
.menu-burger { display: none; }
.acct { position: relative; }
.acct-pop { position: absolute; right: 0; top: calc(100% + var(--s1)); width: 280px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r16); padding: var(--s4); display: grid; gap: var(--s3); z-index: 60; box-shadow: 0 8px 24px rgba(15, 16, 19, 0.08); }
.acct-pop .who { display: grid; gap: var(--s1); }
.hbrand-mobile { display: none; }

/* ---------- 레이아웃 ---------- */
.page { margin: 0 auto; padding: var(--s8) var(--s8) var(--s16); display: grid; gap: var(--s5); align-content: start; min-width: 0; }
.page.owner { max-width: 1200px; }
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); max-width: 1440px; margin: 0 auto; }
.sidenav { padding: var(--s6) var(--s3); display: grid; align-content: start; gap: var(--s4); position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto; }
.sidenav .grp { display: grid; gap: 2px; }
.sidenav .grp > .label { padding: 0 var(--s3) var(--s1); }
.sidenav button { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 44px; text-align: left; background: none; border: 0; border-radius: var(--r12); padding: 0 var(--s3); cursor: pointer; font-size: var(--t15); color: var(--text-mid); font-weight: 500; }
.sidenav button:hover { background: var(--track); }
.sidenav button[aria-current="page"] { background: var(--text); color: var(--on-dark); font-weight: 700; }
.sidenav .cnt { background: var(--accent-text); color: var(--on-dark); border-radius: var(--rpill); font-size: var(--t13); font-weight: 700; padding: 0 var(--s2); line-height: 20px; }
.shell .page { width: 100%; }
.pagehead { display: grid; gap: var(--s2); }
.pagehead h1 { font-size: var(--t32); font-weight: 800; }
.pagehead p { color: var(--text-sub); max-width: 68ch; }
.pagehead .row1 { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.section-title { font-size: var(--t20); font-weight: 800; }
.drawer-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 70; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); background: var(--bg); z-index: 71; overflow-y: auto; padding: calc(var(--s4) + env(safe-area-inset-top, 0px)) var(--s3) var(--s6); display: grid; align-content: start; gap: var(--s4); }
.drawer .sidenav { position: static; height: auto; padding: 0; }

/* ---------- 버튼 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 44px; padding: 0 var(--s4); border-radius: var(--r12); border: 1.5px solid var(--text);
  background: var(--text); color: var(--on-dark); font-weight: 700; font-size: var(--t15); cursor: pointer; white-space: nowrap; text-decoration: none; transition: opacity var(--ease), transform var(--ease); }
.btn:hover { opacity: 0.86; }
.btn:active { transform: scale(0.98); }
.btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
.btn.secondary:hover { border-color: var(--text); opacity: 1; }
.btn.outline { background: var(--surface); color: var(--text); border-color: var(--text); }
.btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.btn.sm { min-height: 44px; padding: 0 var(--s3); font-size: var(--t15); border-radius: var(--r8); }
.btn.lg { min-height: 52px; padding: 0 var(--s6); font-size: var(--t16); }
.btn.pill { border-radius: var(--rpill); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.textbtn { background: none; border: 0; padding: var(--s2) 0; min-height: 44px; min-width: 44px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--text-sub); font-size: var(--t13); }
.textbtn:hover { color: var(--text); }

/* ---------- 입력 ---------- */
.field { display: grid; gap: var(--s1); min-width: 0; }
.input, .field input:not([type=checkbox]):not([type=radio]):not([type=file]), .field select, .field textarea, .select {
  width: 100%; min-height: 44px; padding: 0 var(--s3); border: 1px solid var(--line); border-radius: var(--r12); background: var(--field); min-width: 0; font-size: var(--t15); color: var(--text); }
.field textarea { min-height: 120px; padding: var(--s3); resize: vertical; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus, .select:focus { background: var(--surface); border-color: var(--text); outline: none; }
.selwrap { position: relative; display: inline-block; min-width: 0; max-width: 100%; }
.selwrap::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--text-sub); border-bottom: 1.5px solid var(--text-sub); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.select { width: auto; max-width: 100%; padding-right: var(--s8); appearance: none; -webkit-appearance: none; }
.select.line { background: var(--surface); }
.field .selwrap { display: block; } .field .selwrap select { width: 100%; }
.codeinput { font-family: var(--mono); font-size: var(--t24) !important; letter-spacing: 0.3em; text-transform: uppercase; text-align: center; min-height: 56px !important; font-weight: 700; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-sub); pointer-events: none; }
.search input { width: 100%; min-height: 48px; padding: 0 var(--s4) 0 40px; border: 1px solid var(--line); border-radius: var(--r12); background: var(--surface); font-size: var(--t15); }
.search input:focus { outline: none; border-color: var(--text); }
.check { display: flex; gap: var(--s2); align-items: center; min-height: 44px; font-size: var(--t15); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--text); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--s3); }
.row { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.stack { display: grid; gap: var(--s4); min-width: 0; }
.stack.s2 { gap: var(--s2); } .stack.s6 { gap: var(--s6); }
.hint { font-size: var(--t13); color: var(--text-sub); }

/* ---------- 세그먼트 (미끄러지는 흰 알약) ---------- */
.seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--track); border-radius: var(--r12); padding: var(--s1); isolation: isolate; }
.seg::before { content: ""; position: absolute; z-index: -1; top: var(--s1); bottom: var(--s1); left: var(--s1); width: calc((100% - 8px) / var(--n, 2)); background: var(--surface); border-radius: var(--r8); box-shadow: var(--lift);
  transform: translateX(calc(var(--i, 0) * 100%)); transition: transform var(--ease); }
.seg.none::before { display: none; }
.seg button { border: 0; background: none; min-height: 44px; padding: 0 var(--s3); font-size: var(--t15); font-weight: 600; color: var(--text-sub); cursor: pointer; white-space: nowrap; border-radius: var(--r8); }
.seg button[aria-pressed="true"] { color: var(--text); font-weight: 800; }
.seg.wide { display: grid; width: 100%; }
.seg.wide button { min-height: 44px; font-size: var(--t15); }
.chip { display: inline-flex; align-items: center; gap: var(--s1); min-height: 24px; padding: 0 var(--s2); border-radius: var(--rpill); font-size: var(--t13); font-weight: 700; white-space: nowrap; background: var(--track); color: var(--text-mid); border: 1px solid transparent; }
.chip.filter { min-height: 32px; padding: 0 var(--s2) 0 var(--s3); font-size: var(--t13); cursor: pointer; background: var(--surface); border-color: var(--line); }
.chip.filter span.x { font-size: var(--t15); color: var(--text-sub); }
.chip.accent { background: var(--accent-soft); color: var(--accent-text); }
.st-wait { background: var(--track); color: var(--text-mid); }
.st-done { background: var(--text); color: var(--on-dark); }
.st-line { background: var(--surface); color: var(--text); border-color: var(--text); }
.st-err { background: var(--danger-bg); color: var(--danger); }
.st-virtual { background: var(--warn-bg); color: var(--warn); }
.cats { display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: none; min-height: 44px; padding: 0 var(--s4); border-radius: var(--rpill); border: 1px solid var(--line); background: var(--surface); font-size: var(--t15); font-weight: 600; cursor: pointer; color: var(--text-mid); }
.cats button .n { font-size: var(--t13); color: var(--text-sub); margin-left: var(--s1); font-weight: 500; }
.cats button[aria-pressed="true"] { background: var(--text); color: var(--on-dark); border-color: var(--text); }
.cats button[aria-pressed="true"] .n { color: var(--on-dark); opacity: 0.7; }

/* ---------- 카드·요약 ---------- */
.card { background: var(--surface); border-radius: var(--r20); padding: var(--s6); display: grid; gap: var(--s4); min-width: 0; align-content: start; }
.card.flat { background: var(--track); }
.card h2 { font-size: var(--t16); font-weight: 800; }
.cardhead { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); }
.cardhead h2 { font-size: var(--t20); }
.summary { display: grid; gap: var(--s1); }
.summary .kpi-v { font-size: var(--t48); font-weight: 900; letter-spacing: -0.04em; line-height: 1.1; }
.summary .kpi-v.sm { font-size: var(--t24); font-weight: 800; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s3); }
.delta { font-weight: 700; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.flat { color: var(--text-sub); }
.empty { background: var(--surface); border-radius: var(--r20); padding: var(--s8) var(--s6); display: grid; gap: var(--s3); justify-items: center; text-align: center; color: var(--text-sub); }
.empty b { color: var(--text); font-size: var(--t16); }
.denied { background: var(--danger-bg); border-radius: var(--r20); padding: var(--s6); display: grid; gap: var(--s2); }
.denied b { color: var(--danger); font-size: var(--t16); }
.denied p { color: var(--text-mid); }
.note { background: var(--track); border-radius: var(--r12); padding: var(--s3) var(--s4); font-size: var(--t13); color: var(--text-mid); }
.note.warn { background: var(--warn-bg); color: var(--warn); }

/* ---------- 벤토 ---------- */
.bento { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.tile { background: var(--surface); border-radius: var(--r20); padding: var(--s5); display: grid; grid-template-rows: auto 1fr auto; gap: var(--s3); min-height: 200px; text-align: left; border: 1.5px solid var(--line-strong); font: inherit; color: inherit; cursor: pointer; transition: transform var(--ease); min-width: 0; }
.tile:hover { transform: translateY(-2px); }
.tile .ic { width: 32px; height: 32px; border-radius: var(--r8); background: var(--track); display: grid; place-items: center; }
.tile .ic svg { width: 16px; height: 16px; }
.tile .body { display: grid; align-content: center; gap: var(--s1); min-width: 0; }
.tile .big { font-size: var(--t32); font-weight: 900; letter-spacing: -0.04em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile .big small { font-size: var(--t16); font-weight: 700; margin-left: 2px; }
.tile .ttl { font-size: var(--t15); font-weight: 800; }
.tile.span2 { grid-column: span 2; }
.tile .mini-list { display: grid; gap: var(--s2); font-size: var(--t13); }
.tile .mini-list div { display: flex; justify-content: space-between; gap: var(--s2); align-items: center; }
@media (max-width: 1023px) { .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 599px) { .bento { grid-template-columns: 1fr; } .tile.span2 { grid-column: auto; } .tile { min-height: 160px; } }

/* ---------- 표 ---------- */
.tablewrap { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; background: var(--surface); border-radius: var(--r20); padding: var(--s2) var(--s4); }
.card .tablewrap, .sheet .tablewrap { padding: 0; border-radius: 0; }
.tbl { border-collapse: collapse; width: 100%; font-size: var(--t15); }
.tbl th, .tbl td { text-align: left; padding: var(--s3) var(--s2); border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: var(--t13); font-weight: 600; color: var(--text-sub); white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.r { white-space: nowrap; }
.tbl td.nw { white-space: nowrap; }
.tbl tfoot td { font-weight: 800; border-top: 1.5px solid var(--text); border-bottom: 0; }
.tbl .cell-actions { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.tbl .sm-input, .sm-input { min-height: 44px; width: 120px; padding: 0 var(--s2); border: 1px solid var(--line); border-radius: var(--r8); background: var(--field); font-size: var(--t16); }
.more { justify-self: center; }
